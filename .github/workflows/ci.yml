name: CI Quality Gate

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dolcevita_ci"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dolcevita_ci"
      AUTH_SECRET: "ci_super_secret_test_key_32_characters_long_min!"
      NEXTAUTH_SECRET: "ci_super_secret_test_key_32_characters_long_min!"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Static Analysis (Linting)
        run: pnpm lint

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Unit & Integration Tests (Vitest)
        run: pnpm test

      - name: Production Build Verification
        run: pnpm build
